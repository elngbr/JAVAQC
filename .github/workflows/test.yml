name: Test and Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [21, 25]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: "temurin"
          cache: maven

      - name: Build with Maven
        run: mvn -q clean package

      - name: Run tests
        run: mvn -q test

      - name: Verify CLI works (local mode)
        run: java -cp target/classes org.redfx.strange.demo.TextDemo --format plain

      - name: Verify JSON output works
        run: java -cp target/classes org.redfx.strange.demo.TextDemo --format json

      - name: Generate code coverage report
        run: mvn -q jacoco:report

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        if: always()
        with:
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
